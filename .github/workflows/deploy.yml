name: CD (Produção)

# O título do run mostra o que está sendo publicado: o assunto do commit da main, que no squash da
# merge queue traz o número do PR (ex.: "Título do PR (#351)").
run-name: "CD · ${{ github.event.workflow_run.display_title }}"

# Entrega direta em produção, sempre da ponta da main com CI verde:
#   production  exporta a árvore do commit, constrói as imagens uma vez, sobe a produção e roda
#               o smoke (saúde e commit no ar). Exige a aprovação do environment `production`
#               (Settings > Environments > production > Required reviewers).
# As regras (ordem dos commits, rollback, smoke) estão em scripts/aponta_release.py, com testes,
# e em docs/delivery/RELEASE.md.
on:
  # Never trigger directly on push — that let deploy race the CI workflow
  # on the exact same commit. Deploy only after the CI workflow itself
  # reports a conclusion for a push to main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Um deploy por vez no repositório inteiro, e nenhum run em andamento é cancelado
# (uma migração interrompida deixaria o banco pela metade). Isto não é uma fila: o GitHub mantém só
# o run pendente mais novo, e por isso qualquer run publica a ponta da main.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    name: Commit a publicar
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # Guard clause: only when the upstream CI run was a push to main AND it
    # actually succeeded. A failed/cancelled CI run never reaches the deploy.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      previous_sha: ${{ steps.previous.outputs.previous_sha }}
    steps:
      # O commit em produção antes deste run publicar qualquer coisa: o aviso aos cards do Multica cobre
      # tudo entre ele e a ponta publicada (DMTE-510). A concurrency acima impede outro deploy agora.
      # Qualquer falha deixa a saída vazia e o aviso cai para a ponta.
      - name: Read the commit in production
        id: previous
        run: |
          previous=$(curl -fsS --max-time 10 https://dm.aponta.cloud/api/version | jq -r '.commit // empty' || true)
          if [[ "$previous" =~ ^[0-9a-f]{40}$ ]]; then
            echo "previous_sha=$previous" >> "$GITHUB_OUTPUT"
          else
            echo "Commit em produção ilegível: o aviso cobre só o commit publicado."
          fi
      # What ships is always the tip of main, never "the commit whose CI just
      # finished": CI runs of commits that leave the merge queue together finish
      # out of order (DMTE-472). Any run may publish the tip, but only once the
      # tip's own CI is green; until then it stops here, and the tip's CI
      # triggers another run when it finishes.
      - name: Resolve the commit to deploy
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
          if [ "$tip" != "$TRIGGER_SHA" ]; then
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tip&event=push&status=success" -q .total_count)
            if [ "$green" = "0" ]; then
              echo "CI de $TRIGGER_SHA passou, mas a ponta da main é $tip e o CI dela ainda não passou. Nada a publicar agora."
              exit 0
            fi
          fi
          echo "sha=$tip" >> "$GITHUB_OUTPUT"

  production:
    name: Produção (build e deploy do commit)
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    # A aprovação humana antes de produção vem dos revisores obrigatórios deste environment.
    # Sem eles, o deploy é automático quando o CI da ponta da main passa.
    environment: production
    steps:
      - name: Build once and deploy to production
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 2000
          envs: DEPLOY_SHA
          command_timeout: 40m
          script: |
            set -e
            cd /home/hermes/repos/aponta
            git fetch origin main
            # A ferramenta roda da árvore exportada do próprio commit, nunca do checkout,
            # que pode estar em outra branch.
            release="$HOME/deploy/aponta/releases/$DEPLOY_SHA"
            mkdir -p "$release"
            git archive "$DEPLOY_SHA" | tar -x -C "$release"
            python3 "$release/scripts/aponta_release.py" deploy --sha "$DEPLOY_SHA"

  # Depois do deploy com smoke verde, as issues das linhas `Entrega: #N` dos PRs publicados fecham
  # sozinhas, e a SPEC pai fecha com a última sub-issue. `Refs` nunca fecha. Ver docs/delivery/RELEASE.md.
  close-issues:
    name: Fechar issues entregues
    needs: [resolve, production]
    # Só com o deploy concluído: se o CD quebrar, for recusado ou cancelado, nada fecha.
    if: needs.resolve.outputs.sha != '' && needs.production.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Close the issues delivered to production
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          python3 scripts/close_delivered_issues.py --sha "$DEPLOY_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # Aviso ao card do Multica quando o CD termina, com sucesso ou falha: um comentário por entrega do
  # intervalo publicado, mencionando o dm_lider. Nunca falha o deploy (continue-on-error + exit 0).
  notify:
    name: Aviso ao card Multica
    needs: [resolve, production, close-issues]
    if: always() && needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
        continue-on-error: true
      - name: Comment the CD result on the delivery card
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PREVIOUS_SHA: ${{ needs.resolve.outputs.previous_sha }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: python3 scripts/avisar_card.py
